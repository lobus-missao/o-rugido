name: CI

on:
  pull_request:
    branches: [master, homologation, develop]
  push:
    branches: [master, homologation, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.6"

      - name: Run ruff
        run: ruff check src/ tests/ dashboard/

  test:
    name: Test (pytest + postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orugido
          POSTGRES_PASSWORD: senha_ci
          POSTGRES_DB: o_rugido
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orugido"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://orugido:senha_ci@localhost:5432/o_rugido
      POSTGRES_USER: orugido
      POSTGRES_PASSWORD: senha_ci
      TELEGRAM_BOT_TOKEN: dummy
      TELEGRAM_CHAT_ID: "0"
      O_RUGIDO_DRY_RUN: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -ra

  deploy-homolog:
    name: Deploy homolog
    needs: [lint, test]
    if: github.ref == 'refs/heads/homologation' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Configura SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy no servidor
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" DEPLOY_PATH="$DEPLOY_PATH" bash <<'EOF'
          set -e
          cd "$DEPLOY_PATH"
          git fetch origin
          git checkout homologation
          git reset --hard origin/homologation
          docker compose -f docker-compose.yml up -d --build --remove-orphans
          docker image prune -f
          EOF
